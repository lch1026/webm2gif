name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: flake8 + pytest (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 运行器上还预装了 Framework 版 Python，这里确保后续步骤用矩阵指定的解释器
      - name: 固定解释器
        run: |
          echo "$(dirname "${{ steps.python.outputs.python-path }}")" >> "$GITHUB_PATH"
          python -V

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 代码风格（flake8）
        run: python -m flake8

      - name: 测试（pytest）
        run: python -m pytest -q
